<style>
:root{
  box-sizing:border-box;
  --bg:#faf9ff; --surface:#ffffff; --card:#ffffff; --surfhi:#e9e8f2;
  --primary:#4a56c4; --onprimary:#ffffff; --primcont:#dfe0ff; --onprimcont:#00105c;
  --onsurf:#1a1b21; --onvar:#46464f; --outline:#c7c6d0; --divider:#e4e3ee;
  --red:#d13b34; --orange:#c9720b; --green:#2e7d32;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121318; --surface:#1a1b21; --card:#22232b; --surfhi:#33343d;
    --primary:#bbc3ff; --onprimary:#12277a; --primcont:#313d92; --onprimcont:#dfe0ff;
    --onsurf:#e4e2e9; --onvar:#c7c6d0; --outline:#46464f; --divider:#2c2d35;
    --red:#f2554b; --orange:#f0a13a; --green:#7bd67f;
  }
}
:root[data-theme="dark"]{
  --bg:#121318; --surface:#1a1b21; --card:#22232b; --surfhi:#33343d;
  --primary:#bbc3ff; --onprimary:#12277a; --primcont:#313d92; --onprimcont:#dfe0ff;
  --onsurf:#e4e2e9; --onvar:#c7c6d0; --outline:#46464f; --divider:#2c2d35;
  --red:#f2554b; --orange:#f0a13a; --green:#7bd67f;
}
*{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--onsurf);
  font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#root{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--bg);flex:none}
header h1{font-size:22px;font-weight:600;margin:0;flex:1;letter-spacing:.2px}
.iconbtn{border:none;background:transparent;color:var(--onsurf);font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:color-mix(in srgb,var(--onsurf) 8%,transparent)}
#content{flex:1;overflow-y:auto;padding:0 16px 96px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--surface);border-top:1px solid var(--divider);flex:none;
  padding-bottom:env(safe-area-inset-bottom,0px);position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto}
nav button{flex:1;border:none;background:transparent;color:var(--onvar);cursor:pointer;padding:9px 0 11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-family:inherit}
nav button .ic{font-size:19px;line-height:1;width:52px;height:28px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
nav button.on{color:var(--onsurf);font-weight:600}
nav button.on .ic{background:var(--primcont);color:var(--onprimcont)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.05)}
:root[data-theme="dark"] .card{box-shadow:none;border:1px solid var(--divider)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:none;border:1px solid var(--divider)}}
.card.tight{padding:14px}
.title-lg{font-size:20px;font-weight:600}
.title-md{font-size:17px;font-weight:600}
.muted{color:var(--onvar)}.small{font-size:12.5px}.tiny{font-size:12px}
.sec{padding:18px 0 8px}.sec .t{font-size:16px;font-weight:600}.sec .s{font-size:12.5px;color:var(--onvar);margin-top:2px}
.subhdr{font-size:12.5px;color:var(--onvar);font-weight:600;padding:8px 0 4px}
.bar{height:10px;border-radius:6px;background:var(--surfhi);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--primary);transition:width .3s}
.bar.sm{height:6px;border-radius:4px}.bar.md{height:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:500;line-height:1.3}
.tag .em{font-size:11px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;margin-bottom:10px;font-size:13.5px;line-height:1.45}
.note .em{font-size:16px;line-height:1.3;flex:none}
button.fill,button.tonal,button.out,button.text{border:none;border-radius:20px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;justify-content:center}
button.fill{background:var(--primary);color:var(--onprimary)}
button.tonal{background:var(--primcont);color:var(--onprimcont)}
button.out{background:transparent;color:var(--primary);border:1px solid var(--outline)}
button.text{background:transparent;color:var(--primary);padding:8px 12px}
button.block{width:100%}button:active{transform:scale(.98)}
.roundbtn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;font-size:20px;background:var(--primcont);color:var(--onprimcont);display:grid;place-items:center;font-family:inherit}
.iconsq{width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;font-size:20px;background:var(--primcont);color:var(--onprimcont);display:grid;place-items:center}
.chip{border:1px solid var(--outline);background:transparent;color:var(--onsurf);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.sel{background:var(--primcont);color:var(--onprimcont);border-color:transparent}
.chip.aux.sel{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--onsurf)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{flex:1;border:none;background:transparent;color:var(--onsurf);padding:9px 8px;font-size:13.5px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border-right:1px solid var(--outline)}
.seg button:last-child{border-right:none}.seg button.on{background:var(--primcont);color:var(--onprimcont)}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--surfhi);border-radius:12px;padding:12px}
.stat .l{font-size:12px;color:var(--onvar)}.stat .v{font-size:22px;font-weight:600;margin-top:2px}
.mrow{display:flex;align-items:center;gap:10px;padding:4px 0}
.mrow .ml{width:128px;font-size:13.5px;flex:none}.mrow .mv{width:64px;text-align:right;font-size:12px;flex:none}
.extile .head{display:flex;align-items:flex-start;gap:8px}.extile .name{font-size:16px;font-weight:600}
#overlay{position:fixed;inset:0;z-index:50;display:none}#overlay.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto}
.sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--outline);margin:8px auto 12px}
.dialog{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(100% - 48px);max-width:400px;background:var(--surface);border-radius:26px;padding:22px;max-height:80vh;overflow-y:auto}
input[type=text],input[type=number],select,input[type=date]{width:100%;background:transparent;color:var(--onsurf);border:1px solid var(--outline);border-radius:8px;padding:11px;font-size:15px;font-family:inherit}
textarea{width:100%;background:transparent;color:var(--onsurf);border:1px solid var(--outline);border-radius:8px;padding:11px;font-size:14px;font-family:inherit;resize:vertical;min-height:54px}
label.fld{display:block;font-size:12px;color:var(--onvar);margin:0 0 4px 2px}
.errmsg{color:var(--red);font-size:12.5px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--primary)}
.sw{position:relative;width:44px;height:26px;flex:none;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw .tr{position:absolute;inset:0;background:var(--surfhi);border:2px solid var(--outline);border-radius:14px;transition:.15s}
.sw .kn{position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--outline);transition:.15s}
.sw input:checked + .tr{background:var(--primary);border-color:var(--primary)}
.sw input:checked + .tr + .kn{left:22px;width:16px;height:16px;top:3px;background:var(--onprimary)}
.swrow{display:flex;align-items:center;gap:12px;padding:6px 0}
details.ex{background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden}
:root[data-theme="dark"] details.ex{box-shadow:none;border:1px solid var(--divider)}
details.ex > summary{list-style:none;cursor:pointer;padding:14px 16px}
details.ex > summary::-webkit-details-marker{display:none}
details.ex .body{padding:0 16px 14px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#31313a;color:#f2f0f7;border-radius:8px;padding:12px 16px;font-size:13.5px;display:flex;align-items:center;gap:16px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{background:none;border:none;color:#bbc3ff;font-weight:700;cursor:pointer;font-size:13.5px;font-family:inherit}
.bars{display:flex;align-items:flex-end;gap:6px}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:1px}.bars .b .col{width:16px;border-radius:3px;background:var(--primary)}
.mini{display:flex;align-items:flex-end;gap:4px;height:34px}.mini .mb{width:9px;border-radius:2px;background:var(--primary)}
.badge{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--surfhi);color:var(--onvar);font-weight:600}
.badge.due{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange)}
.spacer{flex:1}hr.d{border:none;border-top:1px solid var(--divider);margin:4px 0}
.grid4{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px 10px;align-items:center}
.grid4 .gh{font-size:11.5px;color:var(--onvar)}
.grid4 input{padding:9px;text-align:center}
</style>
</head>

const pad=n=>String(n).padStart(2,'0');
const dOnly=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const weekday=d=>((d.getDay()+6)%7)+1;
const diffDays=(a,b)=>Math.round((dOnly(a)-dOnly(b))/86400000);
const dayKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dm=d=>`${d.getDate()}.${pad(d.getMonth()+1)}`;
const fmt=v=>Number.isInteger(v)?String(v):v.toFixed(1);
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysSince=ts=>Math.floor((Date.now()-ts)/86400000);
function status(v){return v<1?{t:'Açıkta',c:'var(--red)'}:v<8?{t:'Düşük',c:'var(--orange)'}:{t:'İyi',c:'var(--green)'};}

const KEY='antrenman_takip_v2';
const S={
  start:dOnly(new Date()), active:new Set(), logs:[], custom:[], signals:{}, metrics:[],
  overrides:{}, maxes:[], testInterval:28, _idx:{},
  all(){return [...kCatalog.map(b=>this._idx[b.id]), ...this.custom.map(c=>this._idx[c.id])];},
  ex(id){return this._idx[id];},
  reindex(){this._idx={};for(const b of kCatalog)this._idx[b.id]=effective(b);for(const c of this.custom)this._idx[c.id]=c;},
};
function effective(base){
  const ov=S.overrides[base.id]; if(!ov)return base;
  return Object.assign({},base,{name:ov.name,note:ov.note,pattern:ov.pattern,unit:ov.unit,days:ov.days,
    rpe:ov.rpe,impact:ov.impact,halfRec:ov.halfRec,step:ov.step,muscles:ov.muscles,systems:ov.systems,targets:ov.targets});
}
function defaultActive(){return kCatalog.filter(e=>e.block===null).map(e=>e.id);}
function defOf(e){return {name:e.name,note:e.note,pattern:e.pattern,unit:e.unit,days:[...e.days],rpe:e.rpe,
  impact:e.impact,halfRec:e.halfRec,step:e.step,muscles:{...e.muscles},systems:{...e.systems},
  targets:e.targets.map(t=>({sets:t.sets,v:t.v}))};}
function customToJ(e){return {id:e.id,def:defOf(e)};}
function customFromJ(j){const d=j.def;return E(j.id,d.name,{pattern:d.pattern,unit:d.unit,grp:'Özel',custom:true,
  muscles:d.muscles,systems:d.systems,days:d.days,targets:d.targets,rpe:d.rpe,step:d.step,impact:d.impact,halfRec:d.halfRec,note:d.note});}
function serialize(){return {start:S.start.toISOString(),active:[...S.active],logs:S.logs,metrics:S.metrics,
  signals:S.signals,overrides:S.overrides,maxes:S.maxes,testInterval:S.testInterval,custom:S.custom.map(customToJ),
  updatedAt:S._updatedAt||Date.now()};}
function applyState(d){
  S.start=d.start?dOnly(new Date(d.start)):dOnly(new Date());
  S.overrides=d.overrides||{};
  S.custom=(d.custom||[]).map(customFromJ);
  S.reindex();
  S.active=new Set(d.active&&d.active.length?d.active:defaultActive());
  S.logs=d.logs||[];S.metrics=d.metrics||[];S.signals=d.signals||{};
  S.maxes=d.maxes||[];S.testInterval=d.testInterval||28;
  S._updatedAt=d.updatedAt||Date.now();
}
function load(){
  let raw=null; try{raw=localStorage.getItem(KEY);}catch(e){}
  if(!raw){let v1=null;try{v1=localStorage.getItem('antrenman_takip_v1');}catch(e){}
    if(v1){try{migrateV1(JSON.parse(v1));save();return;}catch(e){}}
    S.active=new Set(defaultActive());S.reindex();save();return;}
  try{applyState(JSON.parse(raw));}
  catch(e){S.active=new Set(defaultActive());S.reindex();}
}
function migrateV1(d){
  S.start=d.start?dOnly(new Date(d.start)):dOnly(new Date());
  S.logs=d.logs||[];S.metrics=d.metrics||[];S.signals=d.signals||{};
  S.overrides={};S.maxes=[];S.testInterval=28;
  S.custom=(d.custom||[]).map(j=>{const muscles={},systems={};for(const n of (j.m||[]))muscles[n]=1;for(const n of (j.s||[]))systems[n]=1;
    const t={sets:j.sets,v:j.v};return E(j.id,j.name,{pattern:j.pattern||'Özel',unit:j.unit,grp:'Özel',custom:true,muscles,systems,days:j.days,targets:[t,{...t},{...t},{...t}],rpe:j.rpe});});
  S.reindex();
  S.active=new Set(d.active&&d.active.length?d.active:defaultActive());
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(serialize()));}catch(e){}}
function save(){if(!Cloud.applying)S._updatedAt=Date.now();saveLocal();if(!Cloud.applying)cloudPush();}
function changed(){save();render();}

/* ══════════════ BULUT SENKRON (Firebase) ══════════════ */
const CFGKEY='fb_config';
const Cloud={cfg:null,app:null,auth:null,db:null,user:null,unsub:null,applying:false,status:'off',err:'',pushT:null,lastSync:0};
function cloudGetCfg(){if(Cloud.cfg)return Cloud.cfg;try{const s=localStorage.getItem(CFGKEY);if(s)Cloud.cfg=JSON.parse(s);}catch(e){}return Cloud.cfg;}
function cloudLibReady(){return typeof window!=='undefined'&&window.firebase&&firebase.auth&&firebase.firestore;}
function parseCfg(txt){let s=(txt||'').trim();const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a>=0&&b>a)s=s.slice(a,b+1);
  try{return JSON.parse(s);}catch(e){}try{return Function('return ('+s+')')();}catch(e){}return null;}
function cloudInit(){
  const cfg=cloudGetCfg();
  if(!cfg){Cloud.status='noconfig';return;}
  if(!cloudLibReady()){Cloud.status='nolib';return;}
  if(Cloud.app){return;}
  try{
    Cloud.app=firebase.initializeApp(cfg);
    Cloud.auth=firebase.auth();Cloud.db=firebase.firestore();
    Cloud.status='signedout';
    Cloud.auth.onAuthStateChanged(u=>{
      Cloud.user=u;
      if(Cloud.unsub){Cloud.unsub();Cloud.unsub=null;}
      if(u){Cloud.status='syncing';cloudSubscribe();}
      else{Cloud.status='signedout';}
      renderIfSettings();
    });
  }catch(e){Cloud.status='error';Cloud.err=e.message;}
}
function cloudSubscribe(){
  if(!Cloud.user)return;
  const ref=Cloud.db.collection('users').doc(Cloud.user.uid);
  Cloud.unsub=ref.onSnapshot(snap=>{
    if(!snap.exists){cloudPush(true);Cloud.status='synced';renderIfSettings();return;}
    const d=snap.data();
    if(d&&typeof d.updatedAt==='number'&&d.updatedAt>(S._updatedAt||0)){
      Cloud.applying=true;
      try{applyState(d);saveLocal();render();}catch(e){}
      Cloud.applying=false;
    }
    Cloud.status='synced';Cloud.lastSync=Date.now();renderIfSettings();
  },err=>{Cloud.status='error';Cloud.err=err.message;renderIfSettings();});
}
function cloudPush(immediate){
  if(!Cloud.user||!Cloud.db||Cloud.applying)return;
  clearTimeout(Cloud.pushT);
  const doPush=()=>{try{Cloud.db.collection('users').doc(Cloud.user.uid).set(serialize())
    .then(()=>{Cloud.lastSync=Date.now();}).catch(e=>{Cloud.status='error';Cloud.err=e.message;renderIfSettings();});}catch(e){}};
  if(immediate)doPush();else Cloud.pushT=setTimeout(doPush,900);
}
function cloudConfigure(txt){const cfg=parseCfg(txt);
  if(!cfg||!cfg.apiKey||!cfg.projectId){Cloud.err='Config okunamadı. apiKey ve projectId içeren nesneyi yapıştır.';return false;}
  Cloud.cfg=cfg;try{localStorage.setItem(CFGKEY,JSON.stringify(cfg));}catch(e){}
  Cloud.app=null;Cloud.err='';cloudInit();return true;}
function cloudForget(){try{localStorage.removeItem(CFGKEY);}catch(e){}location.reload();}
function cloudAuth(mode,email,pw,cb){
  if(!Cloud.auth){cb('Önce Firebase bağlanmalı');return;}
  const p=mode==='up'?Cloud.auth.createUserWithEmailAndPassword(email,pw):Cloud.auth.signInWithEmailAndPassword(email,pw);
  p.then(()=>cb(null)).catch(e=>cb(fbErr(e)));
}
function cloudSignOut(){if(Cloud.auth)Cloud.auth.signOut();}
function fbErr(e){const c=(e&&e.code)||'';
  if(c.includes('email-already-in-use'))return 'Bu e-posta zaten kayıtlı. Giriş yap.';
  if(c.includes('invalid-email'))return 'Geçersiz e-posta.';
  if(c.includes('weak-password'))return 'Şifre en az 6 karakter olmalı.';
  if(c.includes('wrong-password')||c.includes('invalid-credential'))return 'E-posta veya şifre hatalı.';
  if(c.includes('user-not-found'))return 'Kullanıcı bulunamadı. Önce kayıt ol.';
  if(c.includes('network'))return 'Ağ hatası. İnternet bağlantısını kontrol et.';
  if(c.includes('operation-not-allowed'))return 'Firebase konsolunda E-posta/Şifre girişini etkinleştir.';
  if(c.includes('unauthorized-domain')||c.includes('auth/unauthorized-domain'))return 'Bu alan adı Firebase Authentication → Ayarlar → Yetkili alan adlarına eklenmemiş.';
  return (e&&e.message)||'Hata';}
let _cloudOpen=false;
function renderIfSettings(){if(_cloudOpen&&overlay.classList.contains('show'))openCloud();}

/* ── program mantığı ── */
function weekNo(d){return Math.floor(Math.max(0,diffDays(d,S.start))/7)+1;}
function target(e,d){
  if(!e.targets.length)return null;
  const w=weekNo(d), t=e.targets[(w-1)%e.targets.length];
  if(t.sets===0)return null;
  const cycle=Math.floor((w-1)/4);
  let v=t.v+e.step*cycle, sets=t.sets, wd=weekday(d);
  if(e.halfRec&&(wd===3||wd===7))sets=Math.max(1,Math.ceil(sets/2));
  return {sets,v};
}
const catIndex=e=>S.all().indexOf(e);
function todayList(d){const wd=weekday(d);
  const l=S.all().filter(e=>S.active.has(e.id)&&e.days.includes(wd)&&target(e,d)!==null);
  l.sort((a,b)=>{const c=(kGrpOrder[a.grp]??9)-(kGrpOrder[b.grp]??9);return c!==0?c:catIndex(a)-catIndex(b);});return l;}

/* ── kayıt ── */
const dt=l=>new Date(l.t);
function addLog(id,v,r){S.logs.push({e:id,t:Date.now(),v,r});changed();}
function undoLast(id){for(let i=S.logs.length-1;i>=0;i--){if(S.logs[i].e===id){S.logs.splice(i,1);break;}}changed();}
function toggleActive(id){S.active.has(id)?S.active.delete(id):S.active.add(id);changed();}
function removeCustom(id){S.custom=S.custom.filter(e=>e.id!==id);S.active.delete(id);delete S.overrides[id];S.reindex();changed();}
function toggleSignal(key,area){const l=S.signals[key]||(S.signals[key]=[]);const i=l.indexOf(area);i>=0?l.splice(i,1):l.push(area);changed();}
function addMetric(k,v){S.metrics.push({k,v,t:Date.now()});changed();}
function setStart(d){S.start=dOnly(d);changed();}
function setTestInterval(n){S.testInterval=n;changed();}
function resetToday(){const t=dOnly(new Date());S.logs=S.logs.filter(l=>!sameDay(dt(l),t));delete S.signals[dayKey(t)];changed();}
function resetAll(){S.logs=[];S.metrics=[];S.signals={};S.custom=[];S.overrides={};S.maxes=[];S.testInterval=28;S.reindex();S.active=new Set(defaultActive());S.start=dOnly(new Date());changed();}
/* ── egzersiz düzenleme ── */
function saveExercise(id,def){
  if(id&&S.ex(id)&&S.ex(id).custom){const c=S.custom.find(x=>x.id===id);Object.assign(c,{name:def.name,pattern:def.pattern,unit:def.unit,days:def.days,rpe:def.rpe,impact:def.impact,halfRec:def.halfRec,step:def.step,muscles:def.muscles,systems:def.systems,targets:def.targets,note:def.note});}
  else if(id){S.overrides[id]=def;}
  else{const nid='c_'+Date.now();S.custom.push(E(nid,def.name,{pattern:def.pattern,unit:def.unit,grp:'Özel',custom:true,muscles:def.muscles,systems:def.systems,days:def.days,targets:def.targets,rpe:def.rpe,step:def.step,impact:def.impact,halfRec:def.halfRec,note:def.note}));S.active.add(nid);}
  S.reindex();changed();
}
function resetExercise(id){delete S.overrides[id];S.reindex();changed();}
/* ── max / rekor ── */
function addMax(id,v,t){S.maxes.push({e:id,v,t:t??Date.now()});changed();}
function maxHistory(id){return S.maxes.filter(m=>m.e===id).sort((a,b)=>a.t-b.t);}
function lastMax(id){const h=maxHistory(id);return h.length?h[h.length-1]:null;}
function maxDue(id){const lm=lastMax(id);return lm?daysSince(lm.t)>=S.testInterval:true;}
/* ── sorgular ── */
function countOn(id,d){return S.logs.filter(l=>l.e===id&&sameDay(dt(l),d)).length;}
function muscleLoad(days){const from=Date.now()-days*86400000;const r={};for(const m of M_ORDER)r[m]=0;
  for(const l of S.logs){if(l.t<from)continue;const e=S.ex(l.e);if(!e)continue;for(const m in e.muscles)r[m]+=e.muscles[m];}return r;}
function systemLoad(days){const from=Date.now()-days*86400000;const r={};for(const s of S_ORDER)r[s]=0;
  for(const l of S.logs){if(l.t<from)continue;const e=S.ex(l.e);if(!e)continue;for(const s in e.systems)r[s]+=e.systems[s];}return r;}
function patternSets(key,days){const from=Date.now()-days*86400000;let n=0;
  for(const l of S.logs){if(l.t<from)continue;const e=S.ex(l.e);if(e&&e.pattern.includes(key))n++;}return n;}
function recLeft(s){const now=Date.now();let left=0;
  for(let i=S.logs.length-1;i>=0;i--){const l=S.logs[i];const ageMs=now-l.t;if(Math.floor(ageMs/3600000)>96)break;
    const e=S.ex(l.e);if(!e)continue;if((e.systems[s]||0)<1)continue;
    let f=l.r>=8?1:l.r===7?.75:l.r===6?.5:l.r===5?.35:.2;
    if(e.impact&&(s==='tendon'||s==='kemik'||s==='reaktif'))f=Math.max(f,.75);
    const rem=SINFO[s].hours*f-ageMs/3600000;if(rem>left)left=rem;}return left;}
function bestOf(id){let b=null;for(const l of S.logs)if(l.e===id&&(b===null||l.v>b))b=l.v;
  for(const m of S.maxes)if(m.e===id&&(b===null||m.v>b))b=m.v;return b;}
function prereqMet(e){if(!e.prereqId)return null;const b=bestOf(e.prereqId);return b!==null&&b>=e.prereqValue;}
function gapScore(e,ml,sl){let g=0;for(const m in e.muscles){if(e.muscles[m]>=1)g+=ml[m]<1?2:ml[m]<8?1:0;}
  for(const s in e.systems){if(e.systems[s]>=1)g+=sl[s]<1?2:sl[s]<8?1:0;}return g;}
function streak(){let d=dOnly(new Date());const days=new Set(S.logs.map(l=>dayKey(dt(l))));
  if(!days.has(dayKey(d)))d=new Date(d.getTime()-86400000);let n=0;while(days.has(dayKey(d))){n++;d=new Date(d.getTime()-86400000);}return n;}

function tag(text,color,icon){return `<span class="tag" style="color:${color};background:color-mix(in srgb,${color} 15%,transparent)">${icon?`<span class="em">${icon}</span>`:''}${esc(text)}</span>`;}
function exTags(e){let s='<div class="tags">';for(const m in e.muscles)if(e.muscles[m]>=1)s+=tag(MINFO[m].label,'var(--onvar)');
  for(const sy in e.systems)if(e.systems[sy]>=1)s+=tag(SINFO[sy].label,SINFO[sy].color,SINFO[sy].icon);return s+'</div>';}
function sec(t,sub){return `<div class="sec"><div class="t">${esc(t)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div>`;}
function noteBox(t,{color,icon}={}){const c=color||'var(--primary)';return `<div class="note" style="color:${c};background:color-mix(in srgb,${c} 14%,transparent)"><span class="em">${icon||'ℹ️'}</span><div style="color:var(--onsurf)">${esc(t)}</div></div>`;}
function barHtml(val,{color,cls='',bg}={}){const pct=Math.max(0,Math.min(1,val))*100;return `<div class="bar ${cls}" ${bg?`style="background:${bg}"`:''}><i style="width:${pct}%${color?`;background:${color}`:''}"></i></div>`;}

/* ══════════════ BUGÜN ══════════════ */
function renderToday(){
  const today=dOnly(new Date()),wk=weekNo(today),idx=(wk-1)%4,list=todayList(today);
  let done=0,tot=0;for(const e of list){const t=target(e,today);tot+=t.sets;done+=Math.min(t.sets,countOn(e.id,today));}
  let h=`<div class="card"><div class="title-lg">${esc(kDayNames[weekday(today)-1])}: ${esc(kSessions[weekday(today)])}</div>
    <div class="muted" style="margin-top:4px">Hafta ${wk} · ${idx===3?'deload haftası (yük %30-40 az)':'yükleme haftası '+(idx+1)+'/3'}</div>
    <div style="margin-top:14px">${barHtml(tot===0?0:done/tot)}</div>
    <div class="small" style="margin-top:6px">${done} / ${tot} set tamamlandı</div></div>`;
  if(wk>=4)h+=noteBox('Blok 1 bitmek üzere. Sıradaki sekmesinde Blok 2 adaylarını ve kriterlerini kontrol et. Bir döngü bitince hedefler otomatik artar.',{icon:'🚩'});
  h+=signalsCard(today);
  if(list.length===0)h+=noteBox('Bugün için aktif egzersiz yok. Sıradaki sekmesinden program ekleyebilir veya egzersiz oluşturabilirsin.');
  let lastGrp=null;for(const e of list){if(e.grp!==lastGrp){h+=sec(e.grp);lastGrp=e.grp;}h+=exTile(e,today);}
  const hasToday=S.logs.some(l=>sameDay(dt(l),today))||(S.signals[dayKey(today)]||[]).length>0;
  if(hasToday)h+=`<div style="text-align:center;margin-top:12px"><button class="text" data-act="resettoday" style="color:var(--red)">↺ Bugünü sıfırla</button></div>`;
  return h;
}
function signalsCard(today){
  const now=S.signals[dayKey(today)]||[],prev=S.signals[dayKey(new Date(today.getTime()-86400000))]||[];
  const repeat=now.filter(a=>prev.includes(a)),names=new Set();
  for(const a of repeat)for(const id of (kAreaEx[a]||[])){const n=S.ex(id)?.name;if(n)names.add(n);}
  let chips='';for(const a of kAreas)chips+=`<button class="chip ${now.includes(a)?'sel':''}" data-act="sig" data-area="${esc(a)}">${now.includes(a)?'✓ ':''}${esc(a)}</button>`;
  let warn=repeat.length?noteBox(`${repeat.join(', ')} iki gün üst üste işaretlendi. Bu hafta şu egzersizlerin hacmini yarıya indir: ${[...names].join(', ')}.`,{color:'var(--orange)',icon:'⚠️'}):'';
  return `<div class="card tight"><div style="font-weight:600">Sabah sertliği veya ağrı var mı?</div><div class="chipwrap" style="margin-top:8px">${chips}</div>${warn?'<div style="margin-top:10px">'+warn+'</div>':''}</div>`;
}
function exTile(e,day){
  const t=target(e,day),done=countOn(e.id,day),complete=done>=t.sets;
  return `<div class="card extile" style="padding:12px 8px 12px 16px">
    <div class="head"><div style="flex:1" data-act="log" data-id="${e.id}"><div class="name">${esc(e.name)}</div>
      <div class="muted small">${t.sets} set × ${fmt(t.v)} ${esc(e.unit)}</div></div>
      <button class="iconsq" data-act="addset" data-id="${e.id}" title="Set ekle">${complete?'✓':'+'}</button></div>
    <div style="display:flex;align-items:center;gap:10px;margin:8px 8px 0 0">
      <div style="flex:1">${barHtml(Math.min(1,done/t.sets),{cls:'md'})}</div>
      <div class="small" style="font-weight:500">${done}/${t.sets}</div></div>
    <div style="margin:8px 8px 0 0" data-act="log" data-id="${e.id}">${exTags(e)}</div>
    ${e.note?`<div class="muted" style="font-size:12.5px;margin-top:6px" data-act="log" data-id="${e.id}">${esc(e.note)}</div>`:''}</div>`;
}

/* ══════════════ DENGE ══════════════ */

  for(const r of regions){h+=`<div class="subhdr">${esc(r)}</div>`;
    for(const m of M_ORDER)if(MINFO[m].region===r){const st=status(ml[m]);

  h+=sec('Kalıp dengesi','Son 7 gün · set sayısı');
  const pairs=[['İtme','itme','Çekme','çekme'],['Diz baskın','Diz baskın','Kalça baskın','Kalça baskın'],['Dikey çekme','Dikey çekme','Yatay çekme','Yatay çekme']];
  for(const p of pairs){const a=patternSets(p[1],7),b=patternSets(p[3],7);const low=a>0&&b<a*0.5?p[2]:(b>0&&a<b*0.5?p[0]:null);
    h+=noteBox(`${p[0]} ${a} set · ${p[2]} ${b} set${low?'  →  '+low+' geride':''}`,{color:low?'var(--orange)':'var(--green)',icon:low?'⚖️':'✓'});}
  h+=sec('Sistemler','Uyaran (son 7 gün) ve toparlanma durumu');
  for(const s of S_ORDER){const st=status(sl[s]);const rl=recLeft(s);
    h+=`<div class="card tight"><div style="display:flex;align-items:center;gap:12px"><div style="font-size:22px">${SINFO[s].icon}</div>
      <div style="flex:1"><div style="font-weight:600">${esc(SINFO[s].label)}</div><div class="muted tiny">${esc(SINFO[s].desc)}</div>
        <div style="margin-top:6px">${barHtml(sl[s]/maxS,{color:SINFO[s].color,cls:'md',bg:'var(--surfhi)'})}</div></div>
      <div style="text-align:right;min-width:70px"><div style="font-size:12px;color:${st.c};font-weight:500">${fmt(sl[s])} · ${st.t}</div>
        <div style="margin-top:4px;display:flex;justify-content:flex-end">${rl<1?tag('Hazır','var(--green)'):tag('~'+Math.round(rl)+' sa','var(--orange)','⏳')}</div></div></div></div>`;}
  h+=sec('Bugün için öneri');
  const ready=S_ORDER.filter(s=>recLeft(s)<1).sort((a,b)=>sl[a]-sl[b]);
  const focus=ready.filter(s=>sl[s]<8).slice(0,2);
  if(focus.length===0)h+=noteBox('Hazır olan sistemlerin hepsi haftalık uyaranda yeterli görünüyor. Planı takip et.',{color:'var(--green)',icon:'✓'});
  else h+=noteBox(`${focus.map(s=>SINFO[s].label).join(' ve ')} toparlanmış ve haftalık uyaranı düşük. Bugün bunlara ağırlık verebilirsin.`,{icon:'💡'});
  const cands=S.all().filter(e=>!S.active.has(e.id)&&e.block!==null).sort((a,b)=>gapScore(b,ml,sl)-gapScore(a,ml,sl));
  if(cands.length&&gapScore(cands[0],ml,sl)>0)h+=noteBox(`Boşluğu en çok kapatacak aday: ${cands.slice(0,2).map(e=>e.name).join(', ')}. Detay Sıradaki sekmesinde.`,{icon:'🧭'});
  h+=`<div class="muted" style="font-size:12px;line-height:1.45;margin-top:6px">Eşikler: 1 altı açıkta, 8 altı düşük. Toparlanma süresi, RPE'ye ve darbe yüküne göre sistemin standart süresinden (24-72 sa) hesaplanır. Tahmindir, kendi hissinle birlikte oku.</div>`;
  return h;
}

/* ══════════════ İLERLEME ══════════════ */
function renderProgress(){
  const today=dOnly(new Date());
  const ws=new Date(today.getTime()-(weekday(today)-1)*86400000);
  const weekSets=S.logs.filter(l=>dOnly(dt(l))>=ws).length;
  let h=`<div style="height:8px"></div><div class="stats">${statTile('Program haftası',weekNo(today))}${statTile('Bu hafta set',weekSets)}${statTile('Seri (gün)',streak())}</div>`;
  h+=sec('Vücut ölçümleri','Kilo, bel çevresi ve nabzı buradan takip et. Egzersiz maksimumları için Rekor sekmesi.');
  h+=metricsCard();
  h+=sec('Egzersiz ilerlemesi','Son 4 hafta set sayısı ve son 7 gün uyumu');
  const list=S.all().filter(e=>S.active.has(e.id)).sort((a,b)=>(kGrpOrder[a.grp]??9)-(kGrpOrder[b.grp]??9));
  for(const e of list)h+=exProgress(e,today,ws);
  return h;
}
function statTile(l,v){return `<div class="stat"><div class="l">${esc(l)}</div><div class="v">${v}</div></div>`;}
function metricsCard(){
  let rows='';const kinds=[...new Set([...S.metrics.map(m=>m.k)])];
  for(const k of kinds){const ms=S.metrics.filter(m=>m.k===k);if(!ms.length)continue;
    const last=ms[ms.length-1],first=ms[0],d=last.v-first.v;
    const right=ms.length>1?`${d>=0?'+':''}${fmt(d)} (${ms.length} ölçüm)`:dm(new Date(last.t));
    rows+=`<div class="mrow"><div style="flex:1;font-size:13.5px">${esc(k)}</div><div style="font-weight:600">${fmt(last.v)}</div><div style="width:96px;text-align:right;font-size:12px;color:var(--onvar)">${esc(right)}</div></div>`;}
  return `<div class="card tight">${rows||'<div class="muted small">Henüz ölçüm yok. Kilo ve bel çevresi haftalık ortalama olarak tek ölçümden daha anlamlı.</div>'}<div style="margin-top:6px"><button class="text" data-act="metric">＋ Ölçüm ekle</button></div></div>`;
}
function exProgress(e,today,ws){
  const counts=[];for(let i=0;i<4;i++){const s=new Date(ws.getTime()-7*(3-i)*86400000);const en=new Date(s.getTime()+7*86400000);
    counts.push(S.logs.filter(l=>l.e===e.id&&dOnly(dt(l))>=s&&dOnly(dt(l))<en).length);}
  const mx=Math.max(0,...counts),best=bestOf(e.id);
  let expected=0;for(let i=0;i<7;i++){const d=new Date(today.getTime()-i*86400000);if(e.days.includes(weekday(d))){const t=target(e,d);expected+=t?t.sets:0;}}
  const from=Date.now()-7*86400000,recent=S.logs.filter(l=>l.e===e.id&&l.t>from);
  const done=recent.length,pct=expected===0?0:Math.round(done*100/expected);
  const avgRpe=recent.length?recent.reduce((a,l)=>a+l.r,0)/recent.length:null;
  let msg,col;
  if(expected===0){msg='Bu hafta planda yok.';col='var(--onvar)';}
  else if(pct>=90&&avgRpe!==null&&avgRpe<=6){msg='Hedefi rahat tamamlıyorsun. Bir sonraki hafta hedefine geçmeye hazırsın.';col='var(--green)';}
  else if(avgRpe!==null&&avgRpe>=9){msg='Ortalama efor çok yüksek. Hacmi düşürmeyi düşün.';col='var(--orange)';}
  else if(pct<60){msg='Uyum düşük. Yeni bir şey ekleme, mevcut hedefi tamamla.';col='var(--orange)';}
  else{msg='Yolundasın. Aynı hedefle devam.';col='var(--primary)';}
  let bars='';for(let i=0;i<4;i++){const hgt=3+28*(mx===0?0:counts[i]/mx);
    bars+=`<div class="b"><div style="font-size:10.5px">${counts[i]}</div><div class="col" style="height:${hgt}px;opacity:${i===3?1:.43}"></div><div class="tiny muted" style="font-size:10px">${i===3?'bu':'-'+(3-i)+'h'}</div></div>`;}
  return `<div class="card tight"><div style="display:flex;align-items:flex-start;gap:8px">
    <div style="flex:1"><div style="font-weight:600;font-size:15px">${esc(e.name)}</div>
      <div class="muted" style="font-size:12.5px;margin-top:2px">Son 7 gün: ${done}/${expected} set (${pct}%)${avgRpe!==null?' · ort. RPE '+avgRpe.toFixed(1):''}${best!==null?' · en iyi '+fmt(best)+' '+esc(e.unit):''}</div></div>
    <div class="bars">${bars}</div></div>
    <div style="margin-top:8px">${exTags(e)}</div>
    <div style="margin-top:8px;font-size:13px;color:${col};font-weight:500">${esc(msg)}</div></div>`;
}

/* ══════════════ REKOR (MAX) ══════════════ */
function renderMax(){
  const withHist=S.all().filter(e=>maxHistory(e.id).length>0);
  const due=withHist.filter(e=>maxDue(e.id));
  let h=`<div style="height:8px"></div>
    <div class="card tight"><div style="display:flex;align-items:center;gap:12px"><div style="font-size:22px">🗓️</div>
      <div style="flex:1"><div style="font-weight:600">Test aralığı: her ${S.testInterval} gün</div>
        <div class="muted small">${withHist.length} egzersiz takip ediliyor · ${due.length} tanesi test zamanı</div></div>
      <button class="text" data-act="interval">Değiştir</button></div></div>
    <button class="fill block" data-act="addmax">＋ Rekor / max testi gir</button>`;
  if(due.length){h+=sec('Test zamanı geldi','Bu egzersizlerde son testin üzerinden yeterince zaman geçti');for(const e of due)h+=maxCard(e,true);}
  h+=sec(withHist.length?'Takip edilen rekorlar':'Rekorlar');
  if(!withHist.length)h+=noteBox('Henüz rekor girilmedi. Yukarıdaki düğmeyle bir egzersiz seç ve maksimum değerini kaydet. Girdiğin her rekor Sıradaki sekmesindeki kriterleri de günceller.',{icon:'🏅'});
  for(const e of withHist.filter(e=>!maxDue(e.id)))h+=maxCard(e,false);
  return h;
}
function maxCard(e,isDue){
  const hist=maxHistory(e.id),last=hist[hist.length-1],prev=hist.length>1?hist[hist.length-2]:null;
  const d=prev?last.v-prev.v:null,since=daysSince(last.t),mx=Math.max(...hist.map(m=>m.v));
  let mini='';for(const m of hist.slice(-6)){const hgt=6+28*(mx===0?0:m.v/mx);mini+=`<div class="mb" style="height:${hgt}px;opacity:${m===last?1:.5}"></div>`;}
  return `<div class="card tight">
    <div style="display:flex;align-items:center;gap:8px"><div style="flex:1;font-weight:600;font-size:15px">${esc(e.name)}</div>${isDue?'<span class="badge due">test zamanı</span>':''}</div>
    <div style="display:flex;align-items:flex-end;gap:10px;margin-top:6px">
      <div style="font-size:28px;font-weight:600">${fmt(last.v)}<span style="font-size:14px;font-weight:400"> ${esc(e.unit)}</span></div>
      ${d!==null?`<div style="color:${d>=0?'var(--green)':'var(--red)'};font-size:13px;padding-bottom:6px;font-weight:600">${d>=0?'▲':'▼'} ${fmt(Math.abs(d))}</div>`:''}
      <div class="spacer"></div><div class="mini">${mini}</div></div>
    <div class="muted small" style="margin-top:6px">Son test: ${dm(new Date(last.t))} · ${since} gün önce · ${hist.length} kayıt</div>
    <div style="text-align:right;margin-top:8px"><button class="${isDue?'fill':'out'}" data-act="retest" data-id="${e.id}">Yeniden test et</button></div></div>`;
}

}
function libNext(){
  const ml=muscleLoad(7),sl=systemLoad(7);
  const cands=S.all().filter(e=>!S.active.has(e.id)&&e.block!==null).sort((a,b)=>{
    const ma=prereqMet(a)===false?0:1,mb=prereqMet(b)===false?0:1;if(ma!==mb)return mb-ma;return gapScore(b,ml,sl)-gapScore(a,ml,sl);});

      <div style="margin-top:8px">${exTags(e)}</div>
      ${e.fills?`<div style="margin-top:8px;font-size:13px">Kapattığı boşluk: ${esc(e.fills)}</div>`:''}
      ${gaps?`<div class="tags" style="margin-top:6px">${gaps}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:8px;align-items:flex-start"><div style="font-size:18px;line-height:1.2">${micon}</div>

      <div class="body">${exTags(e)}
        ${aux?`<div style="font-size:12.5px;margin-top:8px">Yardımcı: ${esc(aux)}</div>`:''}

const overlay=document.getElementById('overlay');
function openSheet(html){overlay.innerHTML=`<div class="scrim" data-close></div><div class="sheet"><div class="grab"></div>${html}</div>`;overlay.classList.add('show');}
function openDialog(html){overlay.innerHTML=`<div class="scrim" data-close></div><div class="dialog">${html}</div>`;overlay.classList.add('show');}
function closeOverlay(){overlay.classList.remove('show');overlay.innerHTML='';_cloudOpen=false;}

/* ── log sheet ── */
function openLog(e,v0){
  let v=v0,r=e.rpe;
  const stepFor=()=>e.unit==='tekrar'?1:e.unit==='sn'?5:(v>=30?5:1);
  const hint=x=>x<=3?'Çok kolay, ısınma seviyesi':x===4||x===5?'Rahat, 5+ tekrar kalıyor':x===6?'Yaklaşık 4 tekrar kalıyor':x===7?'Yaklaşık 3 tekrar kalıyor':x===8?'Yaklaşık 2 tekrar kalıyor':x===9?'Yaklaşık 1 tekrar kalıyor':'Maksimum efor';
  openSheet(`<div class="title-lg">${esc(e.name)}</div><div style="margin-top:8px">${exTags(e)}</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:24px;margin-top:18px">
      <button class="roundbtn" id="lminus">−</button><div style="font-size:30px;font-weight:500;min-width:120px;text-align:center" id="lval">${fmt(v)} ${esc(e.unit)}</div><button class="roundbtn" id="lplus">＋</button></div>
    <div style="margin-top:14px" id="lhint">Zorluk (RPE): ${r} · ${hint(r)}</div>
    <input type="range" min="1" max="10" step="1" value="${r}" id="lrpe" style="margin-top:6px">
    <div style="margin-top:8px"><button class="fill block" id="lsave">✓ Seti kaydet</button></div>
    <div style="text-align:center;margin-top:4px"><button class="text" id="ledit">✎ Bu egzersizi düzenle</button></div>`);
  const val=overlay.querySelector('#lval'),hnt=overlay.querySelector('#lhint'),upd=()=>val.textContent=`${fmt(v)} ${e.unit}`;
  overlay.querySelector('#lminus').onclick=()=>{v=Math.max(0,v-stepFor());upd();};
  overlay.querySelector('#lplus').onclick=()=>{v=v+stepFor();upd();};
  overlay.querySelector('#lrpe').oninput=ev=>{r=+ev.target.value;hnt.textContent=`Zorluk (RPE): ${r} · ${hint(r)}`;};
  overlay.querySelector('#lsave').onclick=()=>{addLog(e.id,v,r);closeOverlay();};
  overlay.querySelector('#ledit').onclick=()=>{closeOverlay();openEditor(e.id);};
}

/* ── metric dialog ── */
function openMetric(){
  const opts=kKinds.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');
  openDialog(`<div class="title-md" style="margin-bottom:14px">Ölçüm ekle</div><select id="mk">${opts}</select>
    <div style="height:12px"></div><label class="fld">Değer</label><input type="number" inputmode="decimal" id="mv">
    <div class="errmsg" id="merr" style="display:none">Bir sayı gir</div>
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:18px"><button class="text" data-close>Vazgeç</button><button class="fill" id="msave">Kaydet</button></div>`);
  overlay.querySelector('#msave').onclick=()=>{const v=parseFloat(overlay.querySelector('#mv').value.replace(',','.'));
    if(isNaN(v)){overlay.querySelector('#merr').style.display='block';return;}addMetric(overlay.querySelector('#mk').value,v);closeOverlay();};
}

/* ── max sheet ── */
function openMax(fixedId){
  const list=S.all();let cur=fixedId||list[0].id,e=S.ex(cur);
  const stepFor=x=>e.unit==='tekrar'?1:e.unit==='sn'?5:(x>=30?5:1);
  const lm=lastMax(cur);let v=lm?lm.v:(e.targets[0]?e.targets[0].v:1),dateStr=dayKey(dOnly(new Date()));
  const picker=fixedId?'':`<label class="fld">Egzersiz</label><select id="mex">${list.map(x=>`<option value="${x.id}" ${x.id===cur?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div style="height:12px"></div>`;
  openSheet(`<div class="title-lg">${fixedId?esc(e.name)+' — yeni test':'Rekor / max gir'}</div><div style="height:10px"></div>${picker}
    <label class="fld">Maksimum değer</label>
    <div style="display:flex;align-items:center;justify-content:center;gap:24px;margin:6px 0 12px">
      <button class="roundbtn" id="mmin">−</button><div style="font-size:28px;font-weight:500;min-width:120px;text-align:center" id="mvalv">${fmt(v)} ${esc(e.unit)}</div><button class="roundbtn" id="mpl">＋</button></div>
    <label class="fld">Tarih</label><input type="date" id="mdate" value="${dateStr}">
    <div style="height:12px"></div><button class="fill block" id="msv">✓ Kaydet</button>`);
  const upd=()=>overlay.querySelector('#mvalv').textContent=`${fmt(v)} ${e.unit}`;
  overlay.querySelector('#mmin').onclick=()=>{v=Math.max(0,v-stepFor(v));upd();};
  overlay.querySelector('#mpl').onclick=()=>{v=v+stepFor(v);upd();};
  const sel=overlay.querySelector('#mex');
  if(sel)sel.onchange=()=>{cur=sel.value;e=S.ex(cur);const l=lastMax(cur);v=l?l.v:(e.targets[0]?e.targets[0].v:1);upd();};
  overlay.querySelector('#mdate').onchange=ev=>{if(ev.target.value)dateStr=ev.target.value;};
  overlay.querySelector('#msv').onclick=()=>{addMax(cur,v,new Date(dateStr+'T12:00:00').getTime());closeOverlay();};
}
function openInterval(){

    <div class="muted small" style="margin-bottom:12px">Bir rekorun üzerinden bu kadar gün geçince "test zamanı" uyarısı çıkar.</div>

/* ── egzersiz editörü ── */
function openEditor(id){
  const base=id?S.ex(id):null,isCat=base&&!base.custom;
  const st={unit:base?base.unit:'tekrar',rpe:base?base.rpe:5,impact:base?base.impact:false,halfRec:base?base.halfRec:false,
    days:new Set(base?base.days:[]),prim:new Set(base?Object.keys(base.muscles).filter(k=>base.muscles[k]>=1):[]),
    aux:new Set(base?Object.keys(base.muscles).filter(k=>base.muscles[k]<1):[]),
    primS:new Set(base?Object.keys(base.systems).filter(k=>base.systems[k]>=1):[]),
    auxS:new Set(base?Object.keys(base.systems).filter(k=>base.systems[k]<1):[])};
  const tg=base?base.targets.map(t=>({sets:t.sets,v:t.v})):[{sets:3,v:10}];while(tg.length<4)tg.push({sets:tg[0].sets,v:tg[0].v});
  const flat=tg.every(t=>t.sets===tg[0].sets&&t.v===tg[0].v);
  const patterns=[...new Set(kCatalog.map(e=>e.pattern))];
  const chip=(items,set,attr,aux)=>items.map(([v,l])=>`<button type="button" class="chip ${aux?'aux ':''}${set.has(v)?'sel':''}" ${attr}="${v}">${l}</button>`).join('');
  const mItems=M_ORDER.map(m=>[m,esc(MINFO[m].label)]),sItems=S_ORDER.map(s=>[s,SINFO[s].icon+' '+esc(SINFO[s].label)]),dItems=[1,2,3,4,5,6,7].map(i=>[i,kDayShort[i-1]]);
  openSheet(`<div class="title-lg">${id?(isCat?'Egzersizi düzenle':'Özel egzersiz'):'Yeni egzersiz'}</div>
    <div style="height:12px"></div>
    <label class="fld">Ad</label><input type="text" id="ename" value="${base?esc(base.name):''}">
    <div style="height:12px"></div>
    <label class="fld">Kalıp (Denge'deki kalıp analizi bunu kullanır)</label>
    <input type="text" id="epat" list="patlist" value="${base?esc(base.pattern):''}" placeholder="ör. Yatay itme, Dikey çekme">
    <datalist id="patlist">${patterns.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <div style="height:12px"></div>
    <label class="fld">Birim</label>
    <div class="seg" id="eunit"><button type="button" class="${st.unit==='tekrar'?'on':''}" data-u="tekrar">tekrar</button><button type="button" class="${st.unit==='sn'?'on':''}" data-u="sn">sn</button><button type="button" class="${st.unit==='dk'?'on':''}" data-u="dk">dk</button></div>
    ${sec('Set ve tekrar')}
    <div class="swrow"><label class="sw"><input type="checkbox" id="eflat" ${flat?'checked':''}><span class="tr"></span><span class="kn"></span></label><div>Tüm haftalarda aynı</div></div>
    <div id="esimple" style="display:${flat?'block':'none'}">
      <div style="display:flex;gap:12px"><div style="flex:1"><label class="fld">Set</label><input type="number" id="ss" value="${tg[0].sets}"></div>
        <div style="flex:1"><label class="fld" id="svl">Değer (${esc(st.unit)})</label><input type="number" id="sv" value="${fmt(tg[0].v)}"></div></div>
    </div>
    <div id="eadv" style="display:${flat?'none':'block'}">
      <div class="grid4"><div></div><div class="gh">Set</div><div class="gh">Değer</div>
        <div class="gh">Hafta 1</div><input type="number" id="ts0" value="${tg[0].sets}"><input type="number" id="tv0" value="${fmt(tg[0].v)}">
        <div class="gh">Hafta 2</div><input type="number" id="ts1" value="${tg[1].sets}"><input type="number" id="tv1" value="${fmt(tg[1].v)}">
        <div class="gh">Hafta 3</div><input type="number" id="ts2" value="${tg[2].sets}"><input type="number" id="tv2" value="${fmt(tg[2].v)}">
        <div class="gh">Deload</div><input type="number" id="ts3" value="${tg[3].sets}"><input type="number" id="tv3" value="${fmt(tg[3].v)}"></div>
      <div class="muted tiny" style="margin-top:6px">Bir haftada set = 0 girersen o hafta egzersiz gösterilmez.</div>
    </div>
    <div style="height:12px"></div>
    <label class="fld">Döngü artışı (her 4 haftada değere eklenir)</label><input type="number" id="estep" value="${base?fmt(base.step):0}">
    ${sec('Günler')}<div class="chipwrap" id="edays">${chip(dItems,st.days,'data-cd')}</div>
    ${sec('Ana kas grupları','Ağırlık 1 · Denge ve boşluk analizini besler')}<div class="chipwrap" id="eprim">${chip(mItems,st.prim,'data-m')}</div>
    ${sec('Yardımcı kas grupları','Ağırlık 0,5')}<div class="chipwrap" id="eaux">${chip(mItems,st.aux,'data-m',true)}</div>
    ${sec('Ana sistemler','Ağırlık 1 · toparlanma bunlara göre sayılır')}<div class="chipwrap" id="eprims">${chip(sItems,st.primS,'data-s')}</div>
    ${sec('Yardımcı sistemler','Ağırlık 0,5')}<div class="chipwrap" id="eauxs">${chip(sItems,st.auxS,'data-s',true)}</div>
    ${sec('Diğer')}
    <div class="swrow"><label class="sw"><input type="checkbox" id="eimp" ${st.impact?'checked':''}><span class="tr"></span><span class="kn"></span></label><div>Darbeli (tendon/kemik/reaktif toparlanmasını hesaba katar)</div></div>
    <div class="swrow"><label class="sw"><input type="checkbox" id="ehalf" ${st.halfRec?'checked':''}><span class="tr"></span><span class="kn"></span></label><div>Çar/Paz günleri yarım hacim</div></div>
    <div style="height:8px"></div><div id="erh">Varsayılan zorluk (RPE): ${st.rpe}</div>
    <input type="range" min="1" max="10" step="1" value="${st.rpe}" id="erpe">
    <div style="height:8px"></div><label class="fld">Not (opsiyonel)</label><textarea id="enote">${base?esc(base.note):''}</textarea>
    <div class="errmsg" id="eerr" style="display:none"></div>
    <div style="height:12px"></div><button class="fill block" id="esave">${id?'Kaydet':'Programa ekle'}</button>
    ${isCat&&S.overrides[id]?`<div style="text-align:center;margin-top:6px"><button class="text" id="ereset">Varsayılana döndür</button></div>`:''}
    ${base&&base.custom?`<div style="text-align:center;margin-top:6px"><button class="text" id="edel" style="color:var(--red)">Egzersizi sil</button></div>`:''}`);
  // wiring
  overlay.querySelector('#eunit').onclick=ev=>{const b=ev.target.closest('[data-u]');if(!b)return;st.unit=b.dataset.u;
    overlay.querySelectorAll('#eunit button').forEach(x=>x.classList.toggle('on',x===b));
    const sv=overlay.querySelector('#svl');if(sv)sv.textContent=`Değer (${st.unit})`;};
  overlay.querySelector('#eflat').onchange=ev=>{overlay.querySelector('#esimple').style.display=ev.target.checked?'block':'none';overlay.querySelector('#eadv').style.display=ev.target.checked?'none':'block';};
  const grp=(sel,set,ds)=>overlay.querySelectorAll(sel+' [data-'+ds+']').forEach(b=>b.onclick=()=>{const raw=b.dataset[ds];const v=ds==='cd'?+raw:raw;if(set.has(v))set.delete(v);else set.add(v);b.classList.toggle('sel');});
  grp('#edays',st.days,'cd');grp('#eprim',st.prim,'m');grp('#eaux',st.aux,'m');grp('#eprims',st.primS,'s');grp('#eauxs',st.auxS,'s');
  overlay.querySelector('#erpe').oninput=ev=>{st.rpe=+ev.target.value;overlay.querySelector('#erh').textContent=`Varsayılan zorluk (RPE): ${st.rpe}`;};
  overlay.querySelector('#esave').onclick=()=>{
    const err=overlay.querySelector('#eerr'),name=overlay.querySelector('#ename').value.trim();
    const num=el=>parseFloat((overlay.querySelector(el).value||'').replace(',','.'));
    let targets;
    if(overlay.querySelector('#eflat').checked){const s=parseInt(overlay.querySelector('#ss').value,10),v=num('#sv');
      if(!name||isNaN(s)||s<1||isNaN(v)||v<=0){err.textContent='Ad, set ve değer alanlarını doldur.';err.style.display='block';return;}
      targets=[{sets:s,v},{sets:s,v},{sets:s,v},{sets:s,v}];}
    else{targets=[];for(let i=0;i<4;i++){const s=parseInt(overlay.querySelector('#ts'+i).value,10),v=num('#tv'+i);
      if(isNaN(s)||s<0||isNaN(v)||v<0){err.textContent='Tüm hafta değerlerini doldur (set 0 = o hafta yok).';err.style.display='block';return;}targets.push({sets:s,v});}
      if(!name){err.textContent='Ad gir.';err.style.display='block';return;}
      if(targets.every(t=>t.sets===0)){err.textContent='En az bir haftada set > 0 olmalı.';err.style.display='block';return;}}
    if(!st.prim.size){err.textContent='En az bir ana kas grubu seç.';err.style.display='block';return;}
    if(!st.primS.size){err.textContent='En az bir ana sistem seç.';err.style.display='block';return;}
    if(!st.days.size){err.textContent='En az bir gün seç.';err.style.display='block';return;}
    const muscles={},systems={};
    for(const m of st.prim)muscles[m]=1;for(const m of st.aux)if(!muscles[m])muscles[m]=.5;
    for(const s of st.primS)systems[s]=1;for(const s of st.auxS)if(!systems[s])systems[s]=.5;
    const def={name,pattern:overlay.querySelector('#epat').value.trim()||'Özel',unit:st.unit,days:[...st.days].sort((a,b)=>a-b),
      rpe:st.rpe,impact:overlay.querySelector('#eimp').checked,halfRec:overlay.querySelector('#ehalf').checked,
      step:isNaN(num('#estep'))?0:num('#estep'),muscles,systems,targets,note:overlay.querySelector('#enote').value.trim()};
    saveExercise(id,def);closeOverlay();};
  const rb=overlay.querySelector('#ereset');if(rb)rb.onclick=()=>{resetExercise(id);closeOverlay();};
  const db=overlay.querySelector('#edel');if(db)db.onclick=()=>{if(confirm('Bu özel egzersiz silinsin mi?')){removeCustom(id);closeOverlay();}};
}

function cloudStatusText(){
  if(!cloudLibReady()&&!cloudGetCfg())return 'Kapalı · GitHub Pages\'te aç';
  switch(Cloud.status){
    case 'synced':case 'syncing':return Cloud.user?('Açık · '+Cloud.user.email):'Bağlı';
    case 'signedout':return 'Bağlı · giriş yapılmadı';
    case 'noconfig':return 'Firebase bağlanmadı';
    case 'nolib':return 'Kütüphane yüklenmedi (önizlemede çalışmaz)';
    case 'error':return 'Hata';
    default:return 'Kapalı';
  }
}

  } else if(!Cloud.user){
    body=noteBox('Cihazlar arası senkron için e-posta + şifreyle giriş yap. İlk kez kullanıyorsan önce "Kayıt ol".',{icon:'🔐'})
      +`<label class="fld">E-posta</label><input type="text" id="cem" inputmode="email" autocomplete="username">
        <div style="height:10px"></div><label class="fld">Şifre (en az 6 karakter)</label><input type="text" id="cpw" autocomplete="current-password" style="-webkit-text-security:disc">
        <div class="errmsg" id="cerr" style="display:${Cloud.err?'block':'none'}">${esc(Cloud.err)}</div>
        <div style="display:flex;gap:8px;margin-top:12px"><button class="out" id="cin" style="flex:1">Giriş yap</button><button class="fill" id="cup" style="flex:1">Kayıt ol</button></div>
        <div style="text-align:center;margin-top:10px"><button class="text" id="cforget" style="color:var(--red)">Firebase bağlantısını kaldır</button></div>`;
  } else {
    const ok=Cloud.status==='synced';
    body=`<div class="card tight" style="margin:0 0 10px"><div style="display:flex;align-items:center;gap:12px">
        <div style="font-size:24px">${ok?'✅':'🔄'}</div><div style="flex:1">
        <div style="font-weight:600">${ok?'Senkron açık':'Bağlanıyor…'}</div>
        <div class="muted small">${esc(Cloud.user.email)}${Cloud.lastSync?' · son eşitleme '+dm(new Date(Cloud.lastSync))+' '+pad(new Date(Cloud.lastSync).getHours())+':'+pad(new Date(Cloud.lastSync).getMinutes()):''}</div></div></div></div>`
      +noteBox('Bu cihazdaki her değişiklik otomatik olarak buluta yazılır; aynı hesapla girdiğin diğer cihazlar anında güncellenir. Çakışmada en son kaydeden kazanır.',{color:'var(--green)',icon:'ℹ️'})
      +(Cloud.err?`<div class="errmsg">${esc(Cloud.err)}</div>`:'')
      +`<div style="display:flex;gap:8px;margin-top:6px"><button class="out" id="cout" style="flex:1">Çıkış yap</button><button class="text" id="cforget" style="color:var(--red)">Bağlantıyı kaldır</button></div>`;
  }
  openSheet(`<div class="title-lg">☁️ Bulut senkron</div><div style="height:12px"></div>${body}`);
  const q=s=>overlay.querySelector(s);
  const showErr=()=>{const e=q('#cerr');if(e){e.textContent=Cloud.err;e.style.display=Cloud.err?'block':'none';}};
  if(q('#csave'))q('#csave').onclick=()=>{Cloud.err='';if(cloudConfigure(q('#ccfg').value))openCloud();else showErr();};
  if(q('#cforget'))q('#cforget').onclick=()=>{if(confirm('Firebase bağlantısı bu cihazdan kaldırılsın mı? Yerel verilerin silinmez.'))cloudForget();};
  if(q('#cin'))q('#cin').onclick=()=>{Cloud.err='';cloudAuth('in',q('#cem').value.trim(),q('#cpw').value,e=>{if(e){Cloud.err=e;showErr();}else openCloud();});};
  if(q('#cup'))q('#cup').onclick=()=>{Cloud.err='';cloudAuth('up',q('#cem').value.trim(),q('#cpw').value,e=>{if(e){Cloud.err=e;showErr();}else openCloud();});};
  if(q('#cout'))q('#cout').onclick=()=>{cloudSignOut();Cloud.err='';openCloud();};
}
function themePref(){try{return localStorage.getItem('theme')||'system';}catch(e){return 'system';}}
function themeLabel(){return {system:'Sistem',light:'Açık',dark:'Koyu'}[themePref()];}
function applyTheme(){const t=themePref();if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);}
function cycleTheme(){const o=['system','light','dark'];const n=o[(o.indexOf(themePref())+1)%3];try{localStorage.setItem('theme',n);}catch(e){}applyTheme();}

/* ══════════════ OLAYLAR ══════════════ */
document.body.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-nav],[data-act]');if(!el)return;
  if(el.dataset.nav!==undefined){window._sc=0;tab=+el.dataset.nav;render();return;}
  const act=el.dataset.act,id=el.dataset.id;window._sc=document.getElementById('content').scrollTop;
  switch(act){
    case 'settings':openSettings();break;
    case 'resettoday':openDialog(`<div class="title-md">Bugünkü veriler sıfırlansın mı?</div><div class="muted small" style="margin-top:8px">Bugün kaydettiğin setler ve işaretler silinir. Program, geçmiş, rekorlar ve ölçümler etkilenmez.</div><div style="display:flex;justify-content:flex-end;gap:6px;margin-top:18px"><button class="text" data-close>Vazgeç</button><button class="fill" id="tdo2">Bugünü sıfırla</button></div>`);overlay.querySelector('#tdo2').onclick=()=>{resetToday();closeOverlay();};break;
    case 'sig':toggleSignal(dayKey(dOnly(new Date())),el.dataset.area);break;
    case 'addset':{const e=S.ex(id),t=target(e,dOnly(new Date()));addLog(id,t.v,e.rpe);showToast(`${e.name}: ${fmt(t.v)} ${e.unit} kaydedildi`,()=>undoLast(id));break;}
    case 'log':openLog(S.ex(id),target(S.ex(id),dOnly(new Date())).v);break;
    case 'metric':openMetric();break;
    case 'addmax':openMax(null);break;
    case 'retest':openMax(id);break;
    case 'interval':openInterval();break;
    case 'libmode':libMode=+el.dataset.v;render();break;
    case 'fs':filterS=el.dataset.v||null;render();break;
    case 'fm':filterM=el.dataset.v||null;render();break;
    case 'toggle':toggleActive(id);break;
    case 'delcustom':removeCustom(id);break;
    case 'addcustom':openEditor(null);break;
    case 'edit':openEditor(id);break;
    case 'resetex':resetExercise(id);break;
  }
});
document.body.addEventListener('change',ev=>{const el=ev.target.closest('[data-act="toggle-sw"]');
  if(el){window._sc=document.getElementById('content').scrollTop;toggleActive(el.dataset.id);}});
overlay.addEventListener('click',ev=>{if(ev.target.dataset.close!==undefined)closeOverlay();});

/* ── toast ── */
const toastEl=document.getElementById('toast');let toastT=null;
function showToast(msg,undo){toastEl.innerHTML=`<span>${esc(msg)}</span>`+(undo?`<button id="tu">Geri al</button>`:'');
  toastEl.classList.add('show');if(undo)document.getElementById('tu').onclick=()=>{undo();hideToast();};
  clearTimeout(toastT);toastT=setTimeout(hideToast,3000);}
function hideToast(){toastEl.classList.remove('show');}

/* ══════════════ BAŞLAT ══════════════ */
applyTheme();load();render();cloudInit();
</script>
</body>
